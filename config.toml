# Tell — game configuration.
# Secrets (API keys) belong in .env, not here.

[game]
ai_model = "google-gla:gemini-3.1-flash-lite-preview"
ai_retries = 2
prompt_duration = 60
task_prompt_duration = 45
prompt_reading_duration = 10
brain_test_duration = 85
brain_test_challenge_duration = 15
brain_test_challenges = 5
brain_test_results_duration = 15
matchup_duration = 120
matchup_challenge_duration = 12
min_humans = 1
max_players = 10
min_ai = 1
max_ai = 3
total_rounds = 5
record_games = true

[matchmaking]
min_humans = 2
max_humans = 5
countdown_seconds = 20
solo_timeout_seconds = 45
min_total = 5
max_total = 7
