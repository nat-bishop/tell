# Tell — game configuration.
# Secrets (API keys) belong in .env, not here.

[game]
ai_model = "google-gla:gemini-3.1-flash-lite-preview"
ai_retries = 2
prompt_duration = 45
task_prompt_duration = 25
prompt_reading_duration = 10
question_duration = 25
respond_duration = 30
review_duration = 40
nominate_duration = 15
elimination_duration = 12
chain_duration = 64
