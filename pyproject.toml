[project]
name = "tell"
version = "0.1.0"
description = "Multiplayer social deduction game — reverse Turing test"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.12.5",
    "fastapi==0.135.1",
    "uvicorn[standard]==0.41.0",
    "pydantic-ai-slim[google,logfire] @ git+https://github.com/nat-bishop/pydantic-ai.git@add-google-image-size-512#subdirectory=pydantic_ai_slim",
    "logfire[fastapi,google-genai]>=4.16.0",
    "sse-starlette==3.3.2",
    "structlog>=24.1.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "ruff==0.15.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.logfire]
ignore_no_config = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["schemas", "backend"]
